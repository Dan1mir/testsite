<!DOCTYPE html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .ui {
            position: absolute;
            top: 0;
            right: -150px;
            width: 140px;
            text-align: left;
        }

        .score-box {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .controls-info {
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }

        h1 { margin-bottom: 10px; font-size: 24px; }
    </style>
</head>
<body>

    <h1>Тетрис</h1>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <div class="ui">
            <div class="score-box">
                <div>Счет:</div>
                <div id="score" style="font-size: 20px; font-weight: bold;">0</div>
            </div>
            <div class="controls-info">
                <p>🠔 🠖 : Движение</p>
                <p>🠕 : Поворот</p>
                <p>🠗 : Ускорение</p>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');

// Увеличиваем масштаб всего, чтобы пиксели были крупными (20x увеличение)
context.scale(20, 20);

// === ЛОГИКА ИГРЫ ===

// Создание фигур (Матрицы)
function createPiece(type) {
    if (type === 'I') {
        return [
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
        ];
    } else if (type === 'L') {
        return [
            [0, 2, 0],
            [0, 2, 0],
            [0, 2, 2],
        ];
    } else if (type === 'J') {
        return [
            [0, 3, 0],
            [0, 3, 0],
            [3, 3, 0],
        ];
    } else if (type === 'O') {
        return [
            [4, 4],
            [4, 4],
        ];
    } else if (type === 'Z') {
        return [
            [5, 5, 0],
            [0, 5, 5],
            [0, 0, 0],
        ];
    } else if (type === 'S') {
        return [
            [0, 6, 6],
            [6, 6, 0],
            [0, 0, 0],
        ];
    } else if (type === 'T') {
        return [
            [0, 7, 0],
            [7, 7, 7],
            [0, 0, 0],
        ];
    } 
    // === НОВЫЕ ФИГУРЫ ===
    else if (type === 'U') { // Скоба
        return [
            [8, 0, 8],
            [8, 8, 8],
            [0, 0, 0],
        ];
    } else if (type === '+') { // Плюс (Пентамино)
        return [
            [0, 9, 0],
            [9, 9, 9],
            [0, 9, 0],
        ];
    } else if (type === '.') { // Одиночная точка (редкая удача)
        return [
            [10]
        ];
    } else if (type === 'Ʇ') { // Одиночная точка (редкая удача)
        return [
            [7, 7, 7],
            [0, 7, 0],
            [0, 7, 0],
        ];
    }
	
}

// Цвета фигур (Стандартные + Новые)
const colors = [
    null,
    '#FF0D72', // I
    '#0DC2FF', // L
    '#0DFF72', // J
    '#F538FF', // O
    '#FF8E0D', // Z
    '#FFE138', // S
    '#3877FF', // T
    '#FF3838', // U (Красный)
    '#FFFFFF', // + (Белый)
    '#888888', // . (Серый)
	'#888888',
];

// Создание пустой матрицы (игрового поля)
function createMatrix(w, h) {
    const matrix = [];
    while (h--) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

// Проверка столкновений
function collide(arena, player) {
    const m = player.matrix;
    const o = player.pos;
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 &&
               (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

// Отрисовка матрицы на канвасе
function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                // Рисуем основной блок
                context.fillStyle = colors[value];
                context.fillRect(x + offset.x, y + offset.y, 1, 1);
                
                // Эффект "рамки" для красоты
                context.lineWidth = 0.05;
                context.strokeStyle = 'rgba(0,0,0,0.5)';
                context.strokeRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

// Главная функция отрисовки
function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);

    drawMatrix(arena, {x: 0, y: 0});
    drawMatrix(player.matrix, player.pos);
}

// Слияние фигуры игрока с полем
function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

// Поворот матрицы
function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [
                matrix[x][y],
                matrix[y][x],
            ] = [
                matrix[y][x],
                matrix[x][y],
            ];
        }
    }
    if (dir > 0) {
        matrix.forEach(row => row.reverse());
    } else {
        matrix.reverse();
    }
}

// Очистка заполненных линий
function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length -1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
                continue outer;
            }
        }
        
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
    }
    updateScore();
}

// Сброс игрока (новая фигура)
function playerReset() {
    const pieces = 'ILJOTSZU+.'; // Список всех фигур
    player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) -
                   (player.matrix[0].length / 2 | 0);
    
    // Если сразу столкновение - Game Over
    if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
    }
}

// Спуск фигуры вниз
function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
    }
    dropCounter = 0;
}

// Перемещение фигуры
function playerMove(dir) {
    player.pos.x += dir;
    if (collide(arena, player)) {
        player.pos.x -= dir;
    }
}

// Поворот фигуры с проверкой стен
function playerRotate(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

// Обновление HTML счета
function updateScore() {
    document.getElementById('score').innerText = player.score;
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;

// Игровой цикл
function update(time = 0) {
    const deltaTime = time - lastTime;
    lastTime = time;

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
        playerDrop();
    }

    draw();
    requestAnimationFrame(update);
}

// Состояние игрока
const arena = createMatrix(12, 20);
const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    score: 0,
};

// Управление с клавиатуры
document.addEventListener('keydown', event => {
    if (event.keyCode === 37) { // Влево
        playerMove(-1);
    } else if (event.keyCode === 39) { // Вправо
        playerMove(1);
    } else if (event.keyCode === 40) { // Вниз
        playerDrop();
    } else if (event.keyCode === 38) { // Вверх (Поворот)
        playerRotate(1);
    }
});

playerReset();
updateScore();
update();

</script>

</body>
</html>
